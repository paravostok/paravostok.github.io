<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lain Review Layout Final</title>
  
  <style>
    .mockup-container {
      max-width: 950px;
      margin: 40px auto;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #000;
    }

    .mockup-header {
      display: flex; 
      gap: 40px;
      margin-bottom: 50px;
    }

    .poster-col {
      flex: 0 0 240px; 
    }

    .poster-img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 4px;
    }

    .info-col {
      flex: 1; 
      display: flex;
      flex-direction: column;
    }

    .mockup-title {
      font-family: Georgia, 'Times New Roman', Times, serif; 
      font-size: 2.5rem;
      font-weight: normal;
      margin: 0 0 20px 0;
    }

    .info-details {
      display: flex;
      gap: 40px;
    }

    .stats-and-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 1.2rem;
      flex: 0 0 160px; 
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mockup-links {
      display: flex;
      gap: 15px; 
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .mockup-links a {
      color: #e74c3c; 
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
    }

    .mockup-links a:hover {
      text-decoration: underline;
    }

    .mockup-summary-text {
      font-size: 1.5rem;
      line-height: 1.4;
      flex: 1;
    }
    
    .episode-row {
      display: grid;
      grid-template-columns: 240px 100px 1fr;
      gap: 40px; 
      margin-bottom: 40px;
      align-items: center; 
    }

    .thumb-img {
      width: 100%;
      height: 135px; 
      object-fit: cover; 
      border-radius: 4px;
    }

    .ep-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ep-num {
      font-size: 1rem;
    }

    .ep-title {
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .ep-review-text {
      font-size: 1.5rem;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      width: fit-content;
      background-color: #ccc; 
    }
  </style>
</head>
<body>

  <div class="mockup-container">
    
    <header class="mockup-header">
      
      <div class="poster-col">
        <img src="https://seriesgraph.com/_next/image?url=https%3A%2F%2Fimage.tmdb.org%2Ft%2Fp%2Fw400%2F93M6d0pAqVQySKrp43LfBYDTvZ.jpg&w=1920&q=75" alt="Lain Poster" class="poster-img">
      </div>
      
      <div class="info-col">
        <h1 class="mockup-title">Serial Experiments Lain</h1>
        
        <div class="info-details">
          
          <div class="stats-and-links">
            <div class="stat-row">
              <span>Average:</span> <span class="badge dynamic-color">9.0</span>
            </div>
            <div class="stat-row">
              <span>Mean:</span> <span class="badge dynamic-color">7.6</span>
            </div>
            <div class="mockup-links">
              <a href="#">← back to media hub</a>
              <a href="#">← back to home</a>
            </div>
          </div>

          <div class="mockup-summary-text">
            Lain Summary Here
          </div>
          
        </div>
      </div>
      
    </header>

    <article class="episode-row">
      <img src="https://static.wikia.nocookie.net/sel/images/3/33/Chisa_Yomoda_%283%29.png/revision/latest/scale-to-width-down/1016?cb=20200811022015" alt="Ep 1" class="thumb-img">
      
      <div class="ep-meta">
        <div class="ep-num">EP 1</div>
        <div class="badge dynamic-color">9.0</div> 
        <div class="ep-title">Layer 01:<br>Weird</div>
      </div>
      
      <div class="ep-review-text">
        Review Text Here
      </div>
    </article>

    <article class="episode-row">
      <img src="https://beneaththetangles.com/wp-content/uploads/2018/07/img_2133-e1532489262884.jpg" alt="Ep 2" class="thumb-img">
      
      <div class="ep-meta">
        <div class="ep-num">EP 2</div>
        <div class="badge dynamic-color">4.0</div>
        <div class="ep-title">Layer 02:<br>Girls</div>
      </div>
      
      <div class="ep-review-text">
        Review Text Here
      </div>
    </article>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const badges = document.querySelectorAll('.dynamic-color');
      
      badges.forEach(badge => {
        const score = parseFloat(badge.innerText);
        if (!isNaN(score)) {
          const hue = (score / 10) * 120; 
          badge.style.backgroundColor = `hsl(${hue}, 80%, 45%)`;
        }
      });
    });
  </script>

</body>
</html>
