<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lain Review Layout</title>
  
  <style>
    /* Base styling for the container */
    .mockup-container {
      max-width: 950px;
      margin: 40px auto;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #000;
    }

    /* --- THE HEADER SECTION --- */
    .mockup-header {
      display: grid;
      /* 3 Columns: Poster (150px), Stats (180px), Summary (fills the rest) */
      grid-template-columns: 180px 200px 1fr; 
      gap: 20px;
      margin-bottom: 50px;
    }

    .poster-img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    /* Header Typography */
    .mockup-title {
      grid-column: 2 / 4; /* Makes the title span across the stats and summary columns */
      font-family: Georgia, 'Times New Roman', Times, serif; /* Matches your serif mockup font */
      font-size: 2.5rem;
      font-weight: normal;
      margin: 0 0 10px 0;
    }

    .mockup-stats {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 1.5rem;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 160px;
    }

    .mockup-links {
      font-size: 0.75rem;
      margin-top: 15px;
    }

    .mockup-links a {
      color: #000;
      text-decoration: none;
      margin-right: 10px;
    }

    .mockup-summary-text {
      font-size: 1.8rem;
      margin-top: 10px;
    }

    /* --- THE EPISODE ROWS --- */
    .episode-row {
      display: grid;
      /* 3 Columns: Thumbnail (240px), Meta info (100px), Review text (fills the rest) */
      grid-template-columns: 240px 100px 1fr;
      gap: 30px;
      margin-bottom: 40px;
      align-items: center; /* Centers everything vertically */
    }

    .thumb-img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .ep-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ep-num {
      font-size: 1rem;
    }

    .ep-title {
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .ep-review-text {
      font-size: 1.8rem;
    }

    /* --- THE BADGES --- */
    .badge {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 20px;
      color: white;
      font-size: 1rem;
      text-align: center;
      width: fit-content;
    }
    
    .badge-purple { background-color: #9333ea; }
    .badge-green { background-color: #a3e635; color: #fff;}
    .badge-orange { background-color: #eab308; }
  </style>
</head>
<body>

  <div class="mockup-container">
    
    <header class="mockup-header">
      
      <div>
        <img src="https://via.placeholder.com/180x250" alt="Lain Poster" class="poster-img">
      </div>
      
      <h1 class="mockup-title">Serial Experiments Lain</h1>
      
      <div class="mockup-stats">
        <div class="stat-row">
          <span>Average:</span> <span class="badge badge-purple">9.0</span>
        </div>
        <div class="stat-row">
          <span>Mean:</span> <span class="badge badge-green">7.6</span>
        </div>
        <div class="mockup-links">
          <a href="#">back to media hub</a>
          <a href="#">back to home</a>
        </div>
      </div>

      <div class="mockup-summary-text">
        Lain Summary Here
      </div>
      
    </header>

    <article class="episode-row">
      <img src="https://via.placeholder.com/240x135" alt="Ep 1" class="thumb-img">
      
      <div class="ep-meta">
        <div class="ep-num">EP 1</div>
        <div class="badge badge-purple">9.0</div>
        <div class="ep-title">Layer 01:<br>Weird</div>
      </div>
      
      <div class="ep-review-text">
        Review Text Here
      </div>
    </article>

    <article class="episode-row">
      <img src="https://via.placeholder.com/240x135" alt="Ep 2" class="thumb-img">
      
      <div class="ep-meta">
        <div class="ep-num">EP 2</div>
        <div class="badge badge-orange">4.0</div>
        <div class="ep-title">Layer 02:<br>Girls</div>
      </div>
      
      <div class="ep-review-text">
        Review Text Here
      </div>
    </article>

  </div>

</body>
</html>
