<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lain Review Layout</title>
  
  <style>
    .mockup-container {
      max-width: 950px;
      margin: 40px auto;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #000;
    }
    
    .mockup-header {
      display: grid;
      grid-template-columns: 180px 200px 1fr; 
      gap: 20px;
      margin-bottom: 50px;
    }

    .poster-img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .mockup-title {
      grid-column: 2 / 4; 
      font-family: Georgia, 'Times New Roman', Times, serif; 
      font-size: 2.5rem;
      font-weight: normal;
      margin: 0 0 10px 0;
    }

    .mockup-stats {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 1.5rem;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 160px;
    }

    .mockup-links {
      font-size: 0.75rem;
      margin-top: 15px;
    }

    .mockup-links a {
      color: #000;
      text-decoration: none;
      margin-right: 10px;
    }

    .mockup-summary-text {
      font-size: 1.8rem;
      margin-top: 10px;
    }

    .episode-row {
      display: grid;
      grid-template-columns: 240px 100px 1fr;
      gap: 30px;
      margin-bottom: 40px;
      align-items: center; 
    }

    .thumb-img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .ep-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ep-num {
      font-size: 1rem;
    }

    .ep-title {
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .ep-review-text {
      font-size: 1.8rem;
    }

    .badge {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 20px;
      color: white;
      font-size: 1rem;
      text-align: center;
      width: fit-content;
    }
    
    .badge-purple { background-color: #9333ea; }
    .badge-green { background-color: #a3e635; color: #fff;}
    .badge-orange { background-color: #eab308; }
  </style>
</head>
<body>

  <div class="mockup-container">
    
    <header class="mockup-header">
      
      <div>
        <img src="https://seriesgraph.com/_next/image?url=https%3A%2F%2Fimage.tmdb.org%2Ft%2Fp%2Fw400%2F93M6d0pAqVQySKrp43LfBYDTvZ.jpg&w=1920&q=75" alt="Lain Poster" class="poster-img">
      </div>
      
      <h1 class="mockup-title">Serial Experiments Lain</h1>
      
      <div class="mockup-stats">
        <div class="stat-row">
          <span>Average:</span> <span class="badge badge-purple">9.0</span>
        </div>
        <div class="stat-row">
          <span>Mean:</span> <span class="badge badge-green">7.6</span>
        </div>
        <div class="mockup-links">
          <a href="#">back to media hub</a>
          <a href="#">back to home</a>
        </div>
      </div>

      <div class="mockup-summary-text">
        Lain Summary Here
      </div>
      
    </header>

    <article class="episode-row">
      <img src="https://static.wikia.nocookie.net/sel/images/3/33/Chisa_Yomoda_%283%29.png/revision/latest/scale-to-width-down/1016?cb=20200811022015" alt="Ep 1" class="thumb-img">
      
      <div class="ep-meta">
        <div class="ep-num">EP 1</div>
        <div class="badge badge-purple">9.0</div>
        <div class="ep-title">Layer 01:<br>Weird</div>
      </div>
      
      <div class="ep-review-text">
        Review Text Here
      </div>
    </article>

    <article class="episode-row">
      <img src="https://beneaththetangles.com/wp-content/uploads/2018/07/img_2133-e1532489262884.jpg" alt="Ep 2" class="thumb-img">
      
      <div class="ep-meta">
        <div class="ep-num">EP 2</div>
        <div class="badge badge-orange">4.0</div>
        <div class="ep-title">Layer 02:<br>Girls</div>
      </div>
      
      <div class="ep-review-text">
        Review Text Here
      </div>
    </article>

  </div>

</body>
</html>
