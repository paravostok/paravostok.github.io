<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>paravostok • prediction market</title>
  <link rel="stylesheet" href="../style.css"> 
  <style>
    /* Specific styles for the game */
    .market-grid { display: grid; gap: 20px; margin-top: 20px; }
    .event-card { 
      background: #f9f7f2; padding: 20px; border-radius: 8px; 
      border-left: 5px solid #e74c3c;
    }
    .balance-banner { 
      background: #2c3e50; color: white; padding: 10px; 
      border-radius: 8px; text-align: center; margin-bottom: 20px;
    }
    .payout { font-weight: bold; color: #e74c3c; }

    /* --- NEW ACCOUNT STYLES --- */
    .login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; justify-content: center;
      align-items: center; z-index: 1000;
    }
    .login-box {
      background: #f9f7f2; padding: 40px; border-radius: 8px; text-align: center;
      border-top: 5px solid #e74c3c; color: #2c3e50;
    }
    .hidden { display: none !important; }
    .logout-btn { 
      float: right; color: #e74c3c; cursor: pointer; 
      text-decoration: underline; font-size: 0.8em; 
    }
  </style>
</head>
<body>

  <div id="login-modal" class="login-overlay hidden">
    <div class="login-box">
      <h2 style="margin-top: 0;">Identity Required</h2>
      <p>Enter your alias to access the market.</p>
      <input type="text" id="username-input" placeholder="e.g. Satoshi" style="padding: 10px; margin: 15px 0; width: 80%; border: 1px solid #ccc; border-radius: 4px;">
      <br>
      <button onclick="loginUser()" style="padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">Enter Market</button>
    </div>
  </div>

  <header class="site-header">
    <div class="wrapper">
      <h1 class="site-title">the market</h1>
      <p class="site-subtitle">bet your credits on the future</p>
    </div>
  </header>

  <main class="wrapper">
    <div class="balance-banner">
      <span id="user-display" style="font-weight: bold; color: #e74c3c; margin-right: 15px;"></span> 
      Available Credits: <span id="balance">100</span>
      <span class="logout-btn" onclick="logoutUser()">Switch User</span>
    </div>

    <div id="market-container" class="market-grid">
      <p>Consulting the AI Bookie...</p>
    </div>

    <section class="block-section" style="margin-top: 40px;">
      <h2 class="block-title">your active bets</h2>
      <ul id="active-bets-list"></ul>
    </section>

    <section class="block-section" style="margin-top: 40px;">
      <h2 class="block-title">leaderboard</h2>
      <ul id="leaderboard-list" style="list-style: none; padding: 0;">
        <li>Loading scores...</li>
      </ul>
    </section>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js"></script>
</body>
</html>
