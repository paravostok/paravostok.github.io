<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>paravostok • prediction market</title>
  <link rel="stylesheet" href="../style.css"> 
</head>
<body>

  <div id="login-modal" class="login-overlay hidden">
    <div class="login-box">
      <h2 style="margin-top: 0;">Identity Required</h2>
      <p>Enter your alias to access the market.</p>
      <input type="text" id="username-input" placeholder="e.g. Satoshi" style="padding: 10px; margin: 15px 0; width: 80%; border: 1px solid #ccc; border-radius: 4px;">
      <br>
      <button onclick="loginUser()" style="padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">Enter Market</button>
    </div>
  </div>

  <header class="site-header">
    <div class="wrapper">
      <h1 class="site-title">the market</h1>
      <p class="site-subtitle">bet your credits on the future</p>
    </div>
  </header>

  <main class="wrapper">
    <div class="balance-banner">
      <span id="user-display" style="font-weight: bold; color: #e74c3c; margin-right: 15px;"></span> 
      Available Credits: <span id="balance">100</span>
      <span class="logout-btn" onclick="logoutUser()">Switch User</span>
    </div>

    <div id="market-container" class="market-grid">
      <p>Consulting the AI Bookie...</p>
    </div>

    <section class="block-section" style="margin-top: 40px;">
      <h2 class="block-title">your active bets</h2>
      <ul id="active-bets-list"></ul>
    </section>

    <section class="block-section" style="margin-top: 40px;">
      <h2 class="block-title">leaderboard</h2>
      <ul id="leaderboard-list" style="list-style: none; padding: 0;">
        <li>Loading scores...</li>
      </ul>
    </section>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js"></script>
</body>
</html>
