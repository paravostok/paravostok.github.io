<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Map Trivia Quiz</title>
  
  <link rel="icon" type="image/png" href="../assets/favicon.jpg">
  
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="quizStyle.css">
  
  <style>
    /* Layout & Centering */
    body {
      font-family: inherit;
      background-color: #fcfbfa;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    .quiz-wrapper {
      width: 100%;
      max-width: 1150px;
    }
    
    .text-center {
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* Flex Layout for Map and Sidebar */
    .map-layout {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }

    .map-container {
      flex: 1;
      background: #fff; 
      padding: 15px; 
      border-radius: 8px; 
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }

    .map-display {
      width: 100%;
      max-height: 65vh; 
      object-fit: contain; 
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    /* Live Stats Sidebar Styling */
    .stats-sidebar {
      width: 130px;
      background: #fff;
      padding: 20px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-block {
      margin-bottom: 20px;
    }

    .stat-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7f8c8d;
      margin: 0 0 5px 0;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 0;
    }

    /* Settings Panel */
    .settings-panel {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      text-align: left;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    
    .setting-item label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 5px;
    }

    .setting-item select {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }

    .preset-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }

    @media (max-width: 700px) {
      .map-layout {
        flex-direction: column;
      }
      .stats-sidebar {
        width: auto;
        flex-direction: row;
        justify-content: space-around;
        padding: 15px;
      }
      .stat-block {
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>

<div class="quiz-wrapper">
  <div class="post-preview" id="quiz-container" style="padding: 30px;">
    
    <div id="category-screen">
      <div class="quiz-top-nav">
        <a href="../index.html" class="back-home-link">← Back to Home</a>
      </div>
      
      <div class="text-center">
        <h2 class="post-title" style="font-size: 2.4rem; margin-bottom: 5px;">City Map Trivia Quiz</h2>
        <p class="post-excerpt" style="color: #666; margin-bottom: 20px;">Configure your difficulty, then select a region to begin:</p>
      </div>

      <div class="settings-panel">
        <div class="preset-buttons">
          <button class="bet-button" style="background-color: #2ecc71;" onclick="applyPreset('easy')">Easy</button>
          <button class="bet-button" style="background-color: #f39c12;" onclick="applyPreset('medium')">Medium</button>
          <button class="bet-button" style="background-color: #e74c3c;" onclick="applyPreset('hard')">Hard</button>
        </div>
        
        <div class="settings-grid">
          <div class="setting-item">
            <label for="setting-lives">Total Lives</label>
            <select id="setting-lives">
              <option value="unlimited">Unlimited</option>
              <option value="10">10 Lives</option>
              <option value="5" selected>5 Lives</option>
              <option value="3">3 Lives</option>
              <option value="1">1 Life (Sudden Death)</option>
            </select>
          </div>
          <div class="setting-item">
            <label for="setting-tries">Tries Per Map</label>
            <select id="setting-tries">
              <option value="3" selected>3 Tries</option>
              <option value="2">2 Tries</option>
              <option value="1">1 Try</option>
            </select>
          </div>
          <div class="setting-item">
            <label for="setting-hints">Hint Frequency</label>
            <select id="setting-hints">
              <option value="0">Start with 1 Hint</option>
              <option value="1" selected>1 per wrong attempt</option>
              <option value="2">1 per every 2nd wrong attempt</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="category-container">
        <div class="category-card scotland-bg">
          <div class="card-overlay">
            <h3 class="card-title">Scotland</h3>
            <button class="play-button" onclick="startQuiz('scotland')">PLAY</button>
          </div>
        </div>
        
        <div class="category-card uk-bg">
          <div class="card-overlay">
            <h3 class="card-title">UK</h3>
            <button class="play-button" onclick="startQuiz('uk')">PLAY</button>
          </div>
        </div>
        
        <div class="category-card international-bg">
          <div class="card-overlay">
            <h3 class="card-title">International</h3>
            <button class="play-button" onclick="startQuiz('international')">PLAY</button>
          </div>
        </div>
      </div>
    </div>

    <div id="question-screen" class="hidden">
      <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <span class="read-more" style="cursor: pointer;" onclick="resetQuiz()">Quit Game</span>
      </div>
      
      <div class="map-layout">
        <div class="map-container">
          <img id="map-image" src="" alt="Unlabelled city road map" class="map-display">
        </div>
        
        <div class="stats-sidebar">
          <div class="stat-block" id="lives-block">
            <p class="stat-title">Lives</p>
            <p class="stat-number" id="stat-lives" style="color: #e67e22;">♥ 3</p>
          </div>

          <div class="stat-block">
            <p class="stat-title">Correct</p>
            <p class="stat-number" id="stat-correct" style="color: #27ae60;">0</p>
          </div>
          <div class="stat-block">
            <p class="stat-title">Failed</p>
            <p class="stat-number" id="stat-failed" style="color: #e74c3c;">0</p>
          </div>
          <div style="border-top: 1px solid #eee; padding-top: 20px;" class="stat-block">
            <p class="stat-title">Accuracy</p>
            <p class="stat-number" id="stat-percent" style="color: #2c3e50;">0%</p>
          </div>
        </div>
      </div>
      
      <div style="margin-top: 25px; text-align: center;">
        <p class="post-excerpt" id="tries-tracker" style="font-weight: bold; color: #2c3e50; margin-bottom: 10px;">Tries left: 3</p>

        <div id="input-area">
          <input type="text" id="user-answer" class="bet-input" style="width: 50%; max-width: 260px;" placeholder="Enter city name..." autocomplete="off">
          <button class="bet-button" id="submit-btn" onclick="checkAnswer()">Submit</button>
          <button class="bet-button" id="skip-btn" style="background-color: #7f8c8d; margin-left: 5px;" onclick="skipQuestion()">Skip</button>
        </div>

        <div id="hints-container" style="margin-top: 15px; text-align: left; background: rgba(0,0,0,0.02); padding: 0 15px; border-radius: 6px;"></div>
        
        <div id="feedback-area" class="hidden" style="margin-top: 15px; padding: 10px; border-radius: 6px;">
          <p id="feedback-text" style="font-weight: bold; margin: 0;"></p>
          <button class="bet-button" id="next-btn" style="margin-top: 12px; margin-left: 0;" onclick="nextQuestion()">Next Map</button>
        </div>
      </div>
    </div>

    <div id="results-screen" class="hidden" style="text-align: center;">
      <h2 class="post-title" id="results-title">Quiz Complete!</h2>
      <div class="balance-banner" style="margin: 20px auto; max-width: 280px;">
        <span style="font-size: 1.2rem;">Final Score: <span id="final-score">0</span></span>
      </div>
      <p class="post-excerpt" id="results-feedback"></p>
      <button class="bet-button" onclick="resetQuiz()" style="margin-top: 10px;">Play Again</button>
    </div>

  </div>
</div>

<div id="quiz-toast" class="toast error">Please enter a guess!</div>

<script>
  let quizDatabase = {}; 
  let currentQuestions = [];
  let currentQuestionIndex = 0;
  
  // Game Settings & State
  let gameSettings = { lives: 5, maxTries: 3, hintFreq: 1 };
  let currentLives = 5;
  let triesLeft = 3;
  let wrongGuessesThisMap = 0; // NEW: tracks misses to calculate hint frequency
  
  let availableHints = [];
  let isProcessing = false;
  
  let correctCount = 0;
  let failedCount = 0;

  window.addEventListener('DOMContentLoaded', () => {
    fetch('quizData.json')
      .then(res => {
        if (!res.ok) throw new Error("Unable to locate quizData.json.");
        return res.json();
      })
      .then(data => { quizDatabase = data; })
      .catch(err => console.error("Database error:", err));
  });

  // NEW: Apply difficulty presets
  function applyPreset(level) {
    const livesSelect = document.getElementById('setting-lives');
    const triesSelect = document.getElementById('setting-tries');
    const hintsSelect = document.getElementById('setting-hints');

    if (level === 'easy') {
      livesSelect.value = "unlimited";
      triesSelect.value = "3";
      hintsSelect.value = "0"; // Start with 1 hint
    } else if (level === 'medium') {
      livesSelect.value = "5";
      triesSelect.value = "3";
      hintsSelect.value = "1"; // 1 per wrong attempt
    } else if (level === 'hard') {
      livesSelect.value = "1";
      triesSelect.value = "1";
      hintsSelect.value = "2"; // Basically no hints since only 1 try
    }
  }

  function captureSettings() {
    const livesVal = document.getElementById('setting-lives').value;
    gameSettings.lives = livesVal === 'unlimited' ? 'unlimited' : parseInt(livesVal);
    gameSettings.maxTries = parseInt(document.getElementById('setting-tries').value);
    gameSettings.hintFreq = parseInt(document.getElementById('setting-hints').value);
    
    currentLives = gameSettings.lives;
  }

  function startQuiz(category) {
    const maps = quizDatabase[category];
    if (!maps || maps.length === 0) return;

    captureSettings(); // Grab the UI settings before starting

    currentQuestions = [...maps];
    for (let i = currentQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
    }

    currentQuestionIndex = 0;
    correctCount = 0;
    failedCount = 0;
    updateStatsUI();

    document.getElementById('category-screen').classList.add('hidden');
    document.getElementById('question-screen').classList.remove('hidden');
    document.getElementById('results-screen').classList.add('hidden');

    loadQuestion();
  }

  function loadQuestion() {
    isProcessing = false;
    wrongGuessesThisMap = 0; 
    const currentQuestion = currentQuestions[currentQuestionIndex];
    document.getElementById('map-image').src = currentQuestion.image;

    triesLeft = gameSettings.maxTries;
    document.getElementById('tries-tracker').innerText = `Tries left: ${triesLeft}`;
    document.getElementById('tries-tracker').style.color = "#2c3e50"; 
    
    availableHints = [...currentQuestion.hints];
    document.getElementById('hints-container').innerHTML = '';

    // If Hint Frequency is 0, they get a hint immediately
    if (gameSettings.hintFreq === 0) {
      revealRandomHint();
    }

    const textInput = document.getElementById('user-answer');
    textInput.value = '';
    textInput.disabled = false;
    textInput.focus();

    document.getElementById('input-area').classList.remove('hidden');
    document.getElementById('feedback-area').classList.add('hidden');
    document.getElementById('next-btn').innerText = "Next Map"; 
    
    textInput.onkeydown = function(e) {
      if (e.key === 'Enter') {
        e.preventDefault(); 
        checkAnswer();
      }
    };
  }

  function checkAnswer() {
    if (isProcessing) return; 
    
    const userRaw = document.getElementById('user-answer').value;
    const cleanedUserAnswer = userRaw.trim().toLowerCase();

    if (!cleanedUserAnswer) {
      showToast();
      return;
    }

    const currentQuestion = currentQuestions[currentQuestionIndex];
    const isCorrect = currentQuestion.answers.includes(cleanedUserAnswer);

    if (isCorrect) {
      let triesTaken = gameSettings.maxTries - triesLeft + 1; 
      let tryWord = triesTaken === 1 ? "try" : "tries";
      endQuestionState(true, `Correct! You got it in ${triesTaken} ${tryWord}!`);
    } else {
      triesLeft--;
      wrongGuessesThisMap++;
      
      if (triesLeft > 0) {
        document.getElementById('user-answer').value = '';
        document.getElementById('user-answer').focus();
        document.getElementById('tries-tracker').innerText = `Tries left: ${triesLeft}`;
        document.getElementById('tries-tracker').style.color = "#e74c3c";
        
        // Hint Logic based on settings
        if (gameSettings.hintFreq === 1) {
          revealRandomHint();
        } else if (gameSettings.hintFreq === 2 && wrongGuessesThisMap % 2 === 0) {
          revealRandomHint();
        }

      } else {
        document.getElementById('tries-tracker').innerText = `Tries left: 0`;
        handleMapFailure("Out of tries!");
      }
    }
  }

  function skipQuestion() {
    if (isProcessing) return;
    document.getElementById('tries-tracker').innerText = `Tries left: 0`;
    handleMapFailure("Skipped question.");
  }

  function handleMapFailure(message) {
    if (gameSettings.lives !== 'unlimited') {
      currentLives--;
      updateStatsUI();
      if (currentLives <= 0) {
        endQuestionState(false, `${message} And you are out of lives! Game Over.`);
        document.getElementById('next-btn').innerText = "View Results";
        return;
      }
    }
    endQuestionState(false, message);
  }

  function revealRandomHint() {
    if (availableHints.length === 0) return;
    
    const randomIndex = Math.floor(Math.random() * availableHints.length);
    const selectedHint = availableHints.splice(randomIndex, 1)[0];

    const hintContainer = document.getElementById('hints-container');
    const hintElement = document.createElement('p');
    hintElement.className = "post-excerpt";
    hintElement.style.fontStyle = "italic";
    hintElement.style.margin = "8px 0";
    hintElement.innerHTML = `💡 <strong>Hint:</strong> ${selectedHint}`;
    
    hintContainer.appendChild(hintElement);
  }

  function endQuestionState(wasCorrect, customTextMessage) {
    isProcessing = true; 
    document.getElementById('user-answer').disabled = true;
    document.getElementById('input-area').classList.add('hidden');
    
    const feedbackArea = document.getElementById('feedback-area');
    const feedbackText = document.getElementById('feedback-text');
    feedbackArea.classList.remove('hidden');

    const currentQuestion = currentQuestions[currentQuestionIndex];
    const primaryCorrectAnswer = currentQuestion.answers[0].replace(/\b\w/g, c => c.toUpperCase());

    if (wasCorrect) {
      correctCount++;
      feedbackText.innerText = customTextMessage;
      feedbackText.style.color = "#27ae60"; 
    } else {
      failedCount++;
      feedbackText.innerText = `${customTextMessage} It was ${primaryCorrectAnswer}.`;
      feedbackText.style.color = "#e74c3c"; 
    }
    
    updateStatsUI();
  }

  function updateStatsUI() {
    document.getElementById('stat-correct').innerText = correctCount;
    document.getElementById('stat-failed').innerText = failedCount;
    
    // Update Lives UI
    const livesStat = document.getElementById('stat-lives');
    if (gameSettings.lives === 'unlimited') {
      livesStat.innerText = "∞";
      livesStat.style.color = "#2ecc71";
    } else {
      livesStat.innerText = `♥ ${currentLives}`;
      livesStat.style.color = currentLives <= 1 ? "#e74c3c" : "#e67e22";
    }

    const totalAttempted = correctCount + failedCount;
    if (totalAttempted === 0) {
      document.getElementById('stat-percent').innerText = "0%";
    } else {
      const percentage = Math.round((correctCount / totalAttempted) * 100);
      document.getElementById('stat-percent').innerText = `${percentage}%`;
    }
  }

  function nextQuestion() {
    // Check for Game Over condition
    if (gameSettings.lives !== 'unlimited' && currentLives <= 0) {
      showResults(true);
      return;
    }

    document.getElementById('feedback-area').classList.add('hidden'); 
    currentQuestionIndex++;
    if (currentQuestionIndex < currentQuestions.length) {
      loadQuestion();
    } else {
      showResults(false);
    }
  }

  function showResults(isGameOver = false) {
    document.getElementById('question-screen').classList.add('hidden');
    document.getElementById('results-screen').classList.remove('hidden');
    
    const titleEl = document.getElementById('results-title');
    titleEl.innerText = isGameOver ? "Game Over!" : "Quiz Complete!";
    titleEl.style.color = isGameOver ? "#e74c3c" : "inherit";

    document.getElementById('final-score').innerText = `${correctCount} / ${currentQuestions.length}`;
    
    const feedbackText = document.getElementById('results-feedback');
    const totalAttempted = correctCount + failedCount;
    const percentage = totalAttempted === 0 ? 0 : (correctCount / totalAttempted) * 100;

    if (isGameOver) {
      feedbackText.innerText = "You ran out of lives! Adjust your difficulty settings and try again.";
    } else if (percentage === 100) {
      feedbackText.innerText = "Flawless! Complete mastery of the network lines.";
    } else if (percentage >= 60) {
      feedbackText.innerText = "Solid effort. You've got an eye for urban topology.";
    } else {
      feedbackText.innerText = "Time to study the local system registries and trace some lines again.";
    }
  }

  function resetQuiz() {
    document.getElementById('category-screen').classList.remove('hidden');
    document.getElementById('question-screen').classList.add('hidden');
    document.getElementById('results-screen').classList.add('hidden');
  }

  function showToast() {
    const toast = document.getElementById('quiz-toast');
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 2500);
  }
</script>

</body>
</html>
