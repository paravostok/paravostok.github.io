<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Map Trivia Quiz</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      font-family: inherit;
      background-color: #fcfbfa;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .quiz-wrapper {
      width: 100%;
      max-width: 850px; 
    }
    .text-center {
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    .map-display {
      width: 100%;
      max-height: 65vh; 
      object-fit: contain; 
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

<div class="quiz-wrapper">
  <div class="post-preview" id="quiz-container">
    
    <div id="category-screen" class="text-center">
      <h2 class="post-title">City Map Trivia Quiz</h2>
      <p class="post-excerpt">Select a region to test your geographic and transit layout knowledge:</p>
      <div style="display: flex; gap: 15px; justify-content: center; margin-top: 25px; flex-wrap: wrap;">
        <button class="bet-button" onclick="startQuiz('scotland')">Scotland</button>
        <button class="bet-button" onclick="startQuiz('uk')">Rest of UK</button>
        <button class="bet-button" onclick="startQuiz('international')">International</button>
      </div>
    </div>

    <div id="question-screen" class="hidden">
      <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <span class="read-more" style="cursor: pointer;" onclick="resetQuiz()">Quit Game</span>
      </div>
      
      <div style="background: #fff; padding: 15px; border-radius: 8px; box-shadow: inset 0 0 5px rgba(0,0,0,0.05);">
        <img id="map-image" src="" alt="Unlabelled city road map" class="map-display">
      </div>
      
      <div style="margin-top: 25px; text-align: center;">
        <p class="post-excerpt" id="tries-tracker" style="font-weight: bold; color: #2c3e50; margin-bottom: 10px;">Tries left: 4</p>

        <div id="input-area">
          <input type="text" id="user-answer" class="bet-input" style="width: 50%; max-width: 260px;" placeholder="Enter city name..." autocomplete="off">
          <button class="bet-button" id="submit-btn" onclick="checkAnswer()">Submit</button>
          <button class="bet-button" id="skip-btn" style="background-color: #7f8c8d; margin-left: 5px;" onclick="skipQuestion()">Skip</button>
        </div>

        <div id="hints-container" style="margin-top: 15px; text-align: left; background: rgba(0,0,0,0.02); padding: 0 15px; border-radius: 6px;"></div>
        
        <div id="feedback-area" class="hidden" style="margin-top: 15px; padding: 10px; border-radius: 6px;">
          <p id="feedback-text" style="font-weight: bold; margin: 0;"></p>
          <button class="bet-button" id="next-btn" style="margin-top: 12px; margin-left: 0;" onclick="nextQuestion()">Continue</button>
        </div>
      </div>
    </div>

    <div id="results-screen" class="hidden" style="text-align: center;">
      <h2 class="post-title">Quiz Complete!</h2>
      <div class="balance-banner" style="margin: 20px auto; max-width: 280px;">
        <span style="font-size: 1.2rem;">Your Score: <span id="final-score">0</span></span>
      </div>
      <p class="post-excerpt" id="results-feedback"></p>
      <button class="bet-button" onclick="resetQuiz()" style="margin-top: 10px;">Play Again</button>
    </div>

  </div>
</div>

<div id="quiz-toast" class="toast error">Please enter a guess!</div>

<script>
  let quizDatabase = {}; 
  let currentQuestions = [];
  let currentQuestionIndex = 0;
  let score = 0;
  
  let maxTries = 4;
  let triesLeft = 4;
  let availableHints = [];
  let isTransitioning = false; // State lock to prevent phantom double-clicks

  window.addEventListener('DOMContentLoaded', () => {
    fetch('quizData.json')
      .then(res => {
        if (!res.ok) throw new Error("Unable to locate quizData.json.");
        return res.json();
      })
      .then(data => { quizDatabase = data; })
      .catch(err => console.error("Database error:", err));
  });

  function startQuiz(category) {
    const maps = quizDatabase[category];
    if (!maps || maps.length === 0) return;

    currentQuestions = [...maps];
    currentQuestionIndex = 0;
    score = 0;

    document.getElementById('category-screen').classList.add('hidden');
    document.getElementById('question-screen').classList.remove('hidden');
    document.getElementById('results-screen').classList.add('hidden');

    loadQuestion();
  }

  function loadQuestion() {
    isTransitioning = false; // Release input lock
    const currentQuestion = currentQuestions[currentQuestionIndex];
    
    document.getElementById('map-image').src = currentQuestion.image;

    triesLeft = maxTries;
    document.getElementById('tries-tracker').innerText = `Tries left: ${triesLeft}`;
    document.getElementById('tries-tracker').style.color = "#2c3e50"; 
    
    availableHints = [...currentQuestion.hints];
    document.getElementById('hints-container').innerHTML = '';

    // Immediately display Hint #1 on map load
    revealRandomHint();

    const textInput = document.getElementById('user-answer');
    textInput.value = '';
    textInput.disabled = false;
    textInput.focus();

    document.getElementById('input-area').classList.remove('hidden');
    document.getElementById('feedback-area').classList.add('hidden');
    
    textInput.onkeydown = function(e) {
      if (e.key === 'Enter' && !isTransitioning) {
        e.preventDefault();
        checkAnswer();
      }
    };
  }

  function checkAnswer() {
    if (isTransitioning) return; // Block accidental double triggers

    const userRaw = document.getElementById('user-answer').value;
    const cleanedUserAnswer = userRaw.trim().toLowerCase();

    if (!cleanedUserAnswer) {
      showToast();
      return;
    }

    const currentQuestion = currentQuestions[currentQuestionIndex];
    const isCorrect = currentQuestion.answers.includes(cleanedUserAnswer);

    if (isCorrect) {
      score++;
      const attemptsUsed = (maxTries - triesLeft) + 1;
      const tryWord = attemptsUsed === 1 ? "try" : "tries";
      endQuestionState(true, `Spot on! You got the correct answer in ${attemptsUsed} ${tryWord}!`);
    } else {
      triesLeft--;
      if (triesLeft > 0) {
        document.getElementById('user-answer').value = '';
        document.getElementById('user-answer').focus();
        document.getElementById('tries-tracker').innerText = `Tries left: ${triesLeft}`;
        document.getElementById('tries-tracker').style.color = "#e74c3c";
        revealRandomHint();
      } else {
        endQuestionState(false, "Out of tries!");
      }
    }
  }

  function revealRandomHint() {
    if (availableHints.length === 0) return;
    
    const randomIndex = Math.floor(Math.random() * availableHints.length);
    const selectedHint = availableHints.splice(randomIndex, 1)[0];

    const hintContainer = document.getElementById('hints-container');
    const hintElement = document.createElement('p');
    hintElement.className = "post-excerpt";
    hintElement.style.fontStyle = "italic";
    hintElement.style.margin = "8px 0";
    hintElement.innerHTML = `💡 <strong>Hint:</strong> ${selectedHint}`;
    
    hintContainer.appendChild(hintElement);
  }

  function skipQuestion() {
    if (isTransitioning) return;
    endQuestionState(false, "Skipped question.");
  }

  function endQuestionState(wasCorrect, customTextMessage) {
    isTransitioning = true; // Lock the question state down

    document.getElementById('user-answer').disabled = true;
    document.getElementById('input-area').classList.add('hidden');
    
    const feedbackArea = document.getElementById('feedback-area');
    const feedbackText = document.getElementById('feedback-text');
    feedbackArea.classList.remove('hidden');

    const currentQuestion = currentQuestions[currentQuestionIndex];
    const primaryCorrectAnswer = currentQuestion.answers[0].replace(/\b\w/g, c => c.toUpperCase());

    if (wasCorrect) {
      feedbackText.innerText = customTextMessage;
      feedbackText.style.color = "#27ae60"; 
    } else {
      feedbackText.innerText = `${customTextMessage} It was ${primaryCorrectAnswer}.`;
      feedbackText.style.color = "#e74c3c"; 
    }

    // Safely shift focus to Continue without firing keyboard click events
    setTimeout(() => {
      document.getElementById('next-btn').focus();
    }, 50);
  }

  function nextQuestion() {
    if (!isTransitioning) return;
    
    currentQuestionIndex++;
    if (currentQuestionIndex < currentQuestions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById('question-screen').classList.add('hidden');
    document.getElementById('results-screen').classList.remove('hidden');
    
    document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;
    
    const feedbackText = document.getElementById('results-feedback');
    const percentage = (score / currentQuestions.length) * 100;

    if (percentage === 100) {
      feedbackText.innerText = "Flawless! Complete mastery of the network lines.";
    } else if (percentage >= 60) {
      feedbackText.innerText = "Solid effort. You've got an eye for urban topology.";
    } else {
      feedbackText.innerText = "Time to study the local system registries and trace some lines again.";
    }
  }

  function resetQuiz() {
    isTransitioning = false;
    document.getElementById('category-screen').classList.remove('hidden');
    document.getElementById('question-screen').classList.add('hidden');
    document.getElementById('results-screen').classList.add('hidden');
  }

  function showToast() {
    const toast = document.getElementById('quiz-toast');
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 2500);
  }
</script>

</body>
</html>
